<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algoritmusok – lépésről lépésre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2333;--mute:#5b667a;--line:#cfd6e2;--acc:#2457d6;--hl:#ffe27a;--ok:#1f8a4c;--bad:#c93c3c;--code:#f6f8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#181e2a;--ink:#e8ecf4;--mute:#9aa5ba;--line:#2c3547;--acc:#7da2ff;--hl:#5c4d12;--ok:#4cc27f;--bad:#ff7b7b;--code:#111621}}
:root[data-theme="dark"]{--bg:#10141d;--card:#181e2a;--ink:#e8ecf4;--mute:#9aa5ba;--line:#2c3547;--acc:#7da2ff;--hl:#5c4d12;--ok:#4cc27f;--bad:#ff7b7b;--code:#111621}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.6rem;margin:.4em 0 .1em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.2em 0 .4em}
p{margin:.5em 0}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 10px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:1.05rem}
.tag{display:inline-block;font:600 .8rem "JetBrains Mono",ui-monospace,monospace;background:var(--code);border:1px solid var(--line);padding:1px 7px;border-radius:5px}
pre.code{margin:10px 0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 0;overflow-x:auto;font:.92rem/1.7 "JetBrains Mono",ui-monospace,monospace}
pre.code div{padding:0 12px;white-space:pre}
pre.code div.on{background:var(--hl);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:3px}
input,select{font:1rem "JetBrains Mono",ui-monospace,monospace;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);max-width:100%}
input[type=number]{width:80px}
.btn{border:0;background:var(--acc);color:#fff;font:700 1rem inherit;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{font:.92rem "JetBrains Mono",ui-monospace,monospace;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.chip b{color:var(--acc)}
.arr{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin:6px 0}
.cell{min-width:38px;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:4px 0 2px;font:600 1rem "JetBrains Mono",ui-monospace,monospace;background:var(--card)}
.cell small{display:block;font-weight:400;font-size:.7rem;color:var(--mute)}
.cell.h{background:var(--hl);border-color:var(--acc)}
.note{border-left:4px solid var(--acc);padding:4px 10px;margin:8px 0;min-height:2.4em}
.res{font:700 1.05rem "JetBrains Mono",ui-monospace,monospace}
.fb{font-weight:700;margin-left:6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.q{padding:10px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q .row{margin:4px 0}
.ex{color:var(--mute);margin:4px 0 0;font-size:.95rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}
@media (prefers-reduced-motion:no-preference){.cell,pre.code div{transition:background .15s}}
ol.zx{margin:.6em 0 0;padding-left:1.4em;line-height:1.6}ol.zx li{margin:.35em 0}
</style>
<style id='v2'>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap');
:root{--bg:#e9eff5;--card:#fff;--ink:#13202c;--mute:#586879;--line:#d3dde8;--acc:#0b7f89;--acc2:#14a58f;--acc-soft:rgba(11,127,137,.14);--ok:#12805c;--bad:#c2413d;--code:#f0f4f8;--term:#0f1822;--on:#fff;--sh:0 1px 2px rgba(19,32,44,.06),0 12px 28px -14px rgba(19,32,44,.28);--r:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0a1017;--card:#121b26;--ink:#e6edf5;--mute:#93a3b6;--line:#243142;--acc:#43d1c5;--acc2:#7be0a8;--acc-soft:rgba(67,209,197,.14);--ok:#4cc27f;--bad:#ff8a84;--code:#0e1721;--term:#080d13;--on:#04201d;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7)}}
:root[data-theme='dark']{--bg:#0a1017;--card:#121b26;--ink:#e6edf5;--mute:#93a3b6;--line:#243142;--acc:#43d1c5;--acc2:#7be0a8;--acc-soft:rgba(67,209,197,.14);--ok:#4cc27f;--bad:#ff8a84;--code:#0e1721;--term:#080d13;--on:#04201d;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7)}
body{background:radial-gradient(800px 420px at 88% -8%,var(--acc-soft),transparent 62%),radial-gradient(620px 380px at -8% 12%,rgba(255,196,46,.12),transparent 60%),var(--bg);background-attachment:fixed;font-size:17px;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;width:44vmax;height:44vmax;right:-16vmax;top:-22vmax;border-radius:50%;background:radial-gradient(circle,var(--acc-soft),transparent 66%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
main{position:relative;z-index:1}
h1{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;font-weight:800;font-size:clamp(1.9rem,7vw,2.7rem);line-height:1.08;letter-spacing:-.03em;margin:.5em 0 .2em;background:linear-gradient(100deg,var(--ink) 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
h1:before{content:'ZH2 \00b7 GKNB_MSTM065';display:block;font:700 .72rem 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:var(--acc);-webkit-text-fill-color:var(--acc);margin-bottom:8px}
.sub{animation:rise .6s .08s cubic-bezier(.2,.7,.2,1) both}
nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;padding:6px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--sh);top:calc(env(safe-area-inset-top,0px) + 6px)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--mute);border-radius:12px;padding:9px 14px;font-size:.95rem;transition:background .25s,color .25s,transform .2s,box-shadow .25s}
nav button:hover{color:var(--ink);background:var(--acc-soft)}
nav button:active{transform:scale(.96)}
nav button[aria-selected=true]{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);box-shadow:0 6px 16px -6px var(--acc)}
#view>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#view>:nth-child(2){animation-delay:.07s}#view>:nth-child(3){animation-delay:.14s}#view>:nth-child(4){animation-delay:.21s}#view>:nth-child(5){animation-delay:.28s}#view>:nth-child(n+6){animation-delay:.34s}
.card{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.card h3{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;font-size:1.15rem;letter-spacing:-.01em;margin-bottom:8px}
.card h3:before{content:'';flex:0 0 5px;height:1.2em;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.tag{background:var(--acc-soft);border-color:transparent;color:var(--acc);border-radius:7px}
table{border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
td,th{border:0;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{background:var(--code);font-size:.85rem;color:var(--mute)}
label{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:.7rem}
input,select{border-radius:11px;border:1.5px solid var(--line);padding:9px 12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border-radius:12px;padding:10px 18px;box-shadow:0 8px 18px -10px var(--acc);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 22px -10px var(--acc);filter:saturate(1.1)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.alt:hover:not(:disabled){border-color:var(--acc);box-shadow:0 6px 14px -8px var(--acc)}
.btn:disabled{opacity:.35}
pre.code{counter-reset:ln;background:var(--term);color:#d6e2ee;border:0;border-radius:14px;padding:6px 0 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),var(--sh)}
pre.code:before{content:'\25CF  \25CF  \25CF';display:block;padding:4px 14px 8px;font-size:.6rem;letter-spacing:2px;color:#3b4d60}
pre.code div{counter-increment:ln;position:relative;padding:2px 16px 2px 46px;border-left:3px solid transparent;transition:background .3s,border-color .3s,color .3s}
pre.code div:before{content:counter(ln);position:absolute;left:14px;color:#4f6377;font-size:.78em}
pre.code div.on{background:linear-gradient(90deg,rgba(255,196,46,.26),rgba(255,196,46,.03));border-left-color:#ffc42e;color:#fff}
pre.code div.on:before{color:#ffc42e}
.cell{min-width:46px;border-radius:11px;padding:7px 0 3px;font-size:1.1rem;box-shadow:var(--sh);transition:transform .25s,background .25s}
.cell.h{background:linear-gradient(180deg,#ffe38f,#ffc42e);border-color:#e0a800;color:#3a2a00;transform:translateY(-5px);animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.cell.h small{color:#6b5200}
.chip{border-radius:999px;padding:5px 13px;border-color:transparent;background:var(--code);animation:chipin .3s both}
.chip b{color:var(--acc)}
.note{background:var(--acc-soft);border-left:0;border-radius:12px;padding:12px 16px;box-shadow:inset 4px 0 0 var(--acc);animation:noteIn .35s ease both}
#pos{min-width:76px;text-align:center;background:linear-gradient(90deg,var(--acc-soft) var(--p,0%),var(--code) var(--p,0%));transition:background .3s}
.fb{display:inline-block;border-radius:10px;padding:5px 11px;margin-left:0}
.fb:empty{display:none}
.fb.ok{background:rgba(18,128,92,.14);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.fb.bad{background:rgba(194,65,61,.14);animation:shake .4s}
#fin:not(:empty){margin-top:12px;padding:12px 16px;border-radius:12px;border:1.5px dashed var(--acc);background:linear-gradient(135deg,var(--acc-soft),transparent);animation:rise .45s both}
.q{transition:background .2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes noteIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes chipin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:translate(-6vmax,8vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<style id='v3'>
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
main{max-width:760px;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{padding-right:58px}
.tt{position:absolute;right:16px;top:18px;width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--card);font-size:1.15rem;cursor:pointer;box-shadow:var(--sh);transition:transform .25s}
.tt:active{transform:scale(.9) rotate(25deg)}
nav{margin:14px 0 16px;padding-right:30px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
nav button{min-height:44px;white-space:nowrap}
#ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
#ins label{min-width:0}
#ins input,#ins select,#guess{width:100%;min-width:0;font-size:16px}
#ins #go{grid-column:1/-1;min-height:48px}
.row:has(#guess){display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.row:has(#guess) label{min-width:0}
.row:has(#guess) .fb{grid-column:1/-1}
.row:has(#guess) .btn{min-height:46px}
.row:has(#next){position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin:16px -4px 0;padding:8px;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 34px -12px rgba(0,0,0,.4)}
.row:has(#next) .btn{min-height:48px;padding:10px 14px}
#next{flex:1 1 auto;font-size:1.02rem}
#pos{flex:0 0 auto;font-size:.8rem;padding:6px 10px}
.q .row .btn{min-height:44px;min-width:92px}
.arr{padding:10px 2px 12px;scrollbar-width:thin}
.cell{flex:0 0 auto}
.vars{gap:6px}
@media (max-width:560px){
body{font-size:16.5px}
main{padding:14px 12px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.9rem}
.sub{font-size:.95rem}
.card{padding:14px;border-radius:14px}
pre.code{font-size:.8rem;margin-left:-4px;margin-right:-4px;border-radius:12px}
pre.code div{padding-left:38px}
pre.code div:before{left:10px}
.cell{min-width:40px;font-size:1rem}
table{font-size:.82rem}td,th{padding:6px 7px}
.note{font-size:.97rem}
#all{display:none}
}
@media (hover:none){.card:hover{transform:none;border-color:var(--line)}.btn:hover:not(:disabled){transform:none;filter:none}}
@media (min-width:900px){
main{max-width:1020px}
h1{font-size:3rem}
.card:has(#code){display:grid;grid-template-columns:1.1fr 1fr;column-gap:22px;align-items:start}
.card:has(#code)>h3{grid-column:1/-1}
.card:has(#code)>pre{grid-column:1;grid-row:2/7}
.card:has(#code)>:not(h3):not(pre){grid-column:2}
}
</style>
</head>
<body>
<main>
<h1>Algoritmusok és adatstruktúrák</h1>
<p class="sub">ZH2 gyakorló: értsd meg a témákat, ne csak a választ. Minden gyakorlónál előbb tippelj, aztán lépkedj végig.</p>
<nav role="tablist" id="tabs"></nav>
<section id="view"></section>
</main>

<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")};
var TABS=[["th","Elmélet"],["osz","Összefoglaló"],["zh","ZH feladatok"],["sum","Összegzés"],["max","Szöveg: min/max"],["idx","Legkisebb indexe"],["cp","Szövegépítés"],["bub","Buborékrendezés"],["sel","Kiválasztásos"],["ins","Beszúró"],["flt","Szűrés (IN)"]];
var cur="th";

function renderTabs(){
  $("#tabs").innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===cur)+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){cur=b.dataset.t;renderTabs();show()}});
}

/* ---------- ELMÉLET ---------- */
var QUIZ=[
 ["A sor (queue) elemei abban a sorrendben jönnek ki, ahogy betették őket (FIFO).",true,"Sor = FIFO: aki először érkezett, azt szolgálják ki először."],
 ["A bináris keresőfában minden csúcs bal oldali részfájában kisebb, a jobb oldaliban nagyobb kulcsok vannak.",true,"Ez a keresőfa rendezési tulajdonsága. Ettől lehet gyorsan keresni benne."],
 ["Max-kupacban a gyökérelem a legkisebb kulcsot tartalmazza.",false,"Max-kupacban a szülő mindig ≥ a gyerekeinél, ezért a gyökér a legnagyobb."],
 ["Cím szerinti paraméterátadásnál az aktuális paraméter lehet például az A+1 kifejezés.",false,"A kifejezésnek nincs memóriacíme, amit át lehetne adni. Cím szerinti átadásnál változó kell."],
 ["Rekurzív szubrutinnak kell tartalmaznia olyan ágat, amelyben már nem hívja meg önmagát.",true,"Ez az alapeset. Nélküle a hívások sosem állnának meg."],
 ["Az 1-től indexelt tömbben tárolt bináris fa i. csúcsának bal gyereke a 2i. elem.",true,"A jobb gyerek a 2i+1. elem, a szülő a ⌊i/2⌋. elem."],
 ["A gyorsrendezés legrosszabb esetben is n·log n lépésű.",false,"Rossz szétválasztásnál (például a legkisebb elem a pivot egy rendezett tömbben) n² nagyságrendű."],
 ["Egy fában bármely két csúcs között pontosan egy út van.",true,"A fa összefüggő (van út) és körmentes (nincs két különböző út)."],
 ["Egy hívásnál az aktuális és a formális paraméterlista elemszáma azonos.",true,"A paraméterek sorrend szerint párosulnak, ezért a darabszámnak és a típusnak egyeznie kell."],
 ["Min-kupacban a gyökérelem a legkisebb kulcsot tartalmazza.",true,"A szülő mindig kisebb vagy egyenlő a gyerekeinél, így a legkisebb elem van felül."]
];
function theory(){
  $("#view").innerHTML=
  '<div class="card"><h3>1. Verem és sor</h3><p><b>Verem (stack)</b>: egyetlen végén lehet betenni és kivenni. <b>LIFO</b>: <i>Last In, First Out</i>, vagyis az utoljára betett elem jön ki elsőként. Gondolj egy tányérrakásra.</p><p><b>Sor (queue)</b>: az egyik végén teszel be, a másikon veszel ki. <b>FIFO</b>: az elsőként betett jön ki elsőként.</p><p class="ex">Tipp: ha egy állításban „utolsóként betett” és „utoljára kivehető” szerepel, kérdezd meg magadtól: ez melyik szerkezet viselkedése?</p></div>'+
  '<div class="card"><h3>2. Kupac és keresőfa</h3><p>Mindkettő bináris fa, de más a szabályuk:</p><table><tr><th></th><th>Kupac</th><th>Bináris keresőfa</th></tr><tr><td>Szabály</td><td>szülő ≥ (vagy ≤) a gyerekeinél</td><td>bal &lt; gyökér &lt; jobb</td></tr><tr><td>Testvérek között</td><td>nincs sorrend</td><td>van sorrend</td></tr><tr><td>Alak</td><td>majdnem teljes fa, tömbben tárolják</td><td>tetszőleges alak</td></tr><tr><td>Fő használat</td><td>prioritási sor, kupacrendezés</td><td>keresés</td></tr></table><p class="ex">Következtetés: az egyik nem a másik speciális esete, mert a rendezési szabályuk eltér.</p></div>'+
  '<div class="card"><h3>3. Paraméterátadás</h3><p><b>Érték szerint</b>: a szubrutin másolatot kap, az eredeti nem változik. Itt az aktuális paraméter <b>kifejezés is lehet</b> (pl. <span class="tag">N+1</span>).</p><p><b>Cím szerint</b>: a szubrutin a változó címét kapja, így az eredeti változót módosítja. Ezért az aktuális paraméternek <b>változónak</b> kell lennie.</p><p>Az adatszerkezeti táblázat <b>Jelleg</b> oszlopa: <span class="tag">I</span> bemenő adat, <span class="tag">O</span> kimenő adat (eredmény), <span class="tag">M</span> módosuló érték (a szubrutin ír bele).</p></div>'+
  '<div class="card"><h3>4. Rekurzió</h3><p>Egy szubrutin <b>rekurzív</b>, ha (közvetlenül vagy közvetve) önmagát hívja. Két része van: az <b>alapeset</b> (itt már nem hívja magát, ez állítja meg) és a <b>rekurzív lépés</b> (kisebb feladatra hívja önmagát).</p><p>Példa: <span class="tag">F(N)</span> = ha N ≤ 1, akkor 1, különben N · F(N-1). Nézd meg: van ebben ciklus? A rekurzió és az iteráció két különböző módszer az ismétlésre, és gyakran egymás helyettesítői.</p></div>'+
  '<div class="card"><h3>5. Fák tárolása</h3><p>Dinamikus megoldás: a csúcsok külön elemek, mutatókkal összekötve (bal és jobb gyerek). De a fa <b>tömbben</b> is tárolható. Bináris fánál, ha a gyökér az 1. elem, az i. elem gyerekei a <span class="tag">2i</span> és <span class="tag">2i+1</span> indexen vannak, a szülője a <span class="tag">⌊i/2⌋</span>. A kupacot is így szokták tárolni. Általános fánál is lehet tömböt használni, ha minden csúcshoz a szülő (vagy a gyerekek) indexét tárolod.</p></div>'+
  '<div class="card"><h3>6. Jelleg és átadás módja</h3><p>A <b>jelleg</b> azt mondja meg, mit csinál a szubrutin a paraméterrel: <span class="tag">I</span> csak olvassa, <span class="tag">O</span> eredményt ad vissza, <span class="tag">M</span> módosul az értéke. Az érték szerint átadott paraméter <b>másolat</b>, a másolat módosítása nem látszik a hívónál. A cím szerinti paraméter ugyanazt a változót éri el. Gondold végig: melyik jelleg igényel visszajutó értéket, és melyik átadás tudja ezt?</p></div>'+
  '<div class="card"><h3>Formális és aktuális paraméter</h3><p>A <b>formális</b> paraméterek a szubrutin fejlécében és adatszerkezeti táblázatában szerepelnek (pl. <span class="tag">VALAMI(A, DB, ER)</span>). Az <b>aktuális</b> paraméterek a híváskor megadott változók vagy kifejezések. A párosítás <b>sorrend szerint</b> történik, ezért a számuknak és a típusuknak egyeznie kell. Érték szerinti átadásnál az aktuális paraméter lehet konstans, változó vagy kifejezés is, cím szerintinél változónak kell lennie.</p><p>Kupacnál: max-kupacban a gyökér a legnagyobb, min-kupacban a legkisebb elem.</p></div>'+
  '<div class="card"><h3>7. Fa és rendezések</h3><p>A <b>fa</b> összefüggő, körmentes gráf. A bináris fa minden csúcsának legfeljebb két gyereke van.</p><table><tr><th>Módszer</th><th>Ötlet</th><th>Lépésszám</th></tr><tr><td>Buborék</td><td>szomszédos cserék</td><td>n²</td></tr><tr><td>Kiválasztásos</td><td>minden körben a legnagyobb (vagy legkisebb) a helyére kerül</td><td>n²</td></tr><tr><td>Beszúró</td><td>az I. elemet beszúrjuk a rendezett elejébe</td><td>n² (majdnem rendezettre gyors)</td></tr><tr><td>Gyorsrendezés</td><td>szétválogatás, majd rekurzív rendezés</td><td>átlag n·log n, legrosszabb n²</td></tr></table><p class="ex">A gyorsrendezés gyorsasága a kiegyensúlyozott szétválogatásból jön. A rekurzió önmagában még nem ad hatékonyságot: gondold végig, mi történik rossz szétválasztásnál.</p></div>'+
  '<div class="card"><h3>Önellenőrző</h3><div id="quiz"></div></div>'+
  '<div class="card"><h3>Így kövess végig egy algoritmust</h3><p>1) Írd fel a változókat egy táblázatba. 2) Menj sorról sorra, és minden értékadás után írd át a változót. 3) Ciklusnál minden körhöz írj új sort. 4) Ne gondolj a „céljára” az algoritmusnak, csak hajtsd végre mechanikusan. A következő fülek ezt gyakoroltatják.</p></div>';
  $("#quiz").innerHTML=QUIZ.map(function(q,i){return '<div class="q"><div>'+esc(q[0])+'</div><div class="row"><button class="btn alt" data-i="'+i+'" data-a="1">Igaz</button><button class="btn alt" data-i="'+i+'" data-a="0">Hamis</button><span class="fb" id="fb'+i+'"></span></div></div>'}).join("");
  document.querySelectorAll("#quiz button").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.i,ans=b.dataset.a==="1",ok=ans===QUIZ[i][1],f=$("#fb"+i);
    f.className="fb "+(ok?"ok":"bad");f.textContent=(ok?"Helyes. ":"Nem. ")+QUIZ[i][2];}});
}

function summary(){
  var C=function(t,b){return '<div class="card"><h3>'+t+'</h3>'+b+'</div>'};
  $("#view").innerHTML=
  C("1. Programkészítés, algoritmusleírás",'<p><b>Programkészítés lépései:</b> 1) feladat megfogalmazása / pontosítása / általánosítása, 2) matematikai modell kiválasztása, 3) adatszerkezet és I/O specifikálása, 4) algoritmus tervezése, 5) kódolás, 6) tesztelés, hibakeresés, 7) dokumentálás.</p><p><b>Algoritmus megadása:</b> szöveges leírás, folyamatábra, D-diagram (strukturált folyamatábra: csak szekvencia, szelekció, iteráció), struktúradiagram (felülről lefelé tervezés), struktogram (dobozos), pszeudokód.</p>')+
  C("2. Egyszerű adattípusok",'<table><tr><th>Típus</th><th>Lényeg</th></tr><tr><td>Egész</td><td>fixpontos, 1, 2 vagy 4 bájt, előjeles vagy előjel nélküli. 4 bájtos előjeles: −2 147 483 648 … 2 147 483 647. Osztás: <span class="tag">//</span> <span class="tag">DIV</span> hányados, <span class="tag">%</span> <span class="tag">MOD</span> maradék.</td></tr><tr><td>Valós</td><td>lebegőpontos, 4 bájt (~1E38, 7–8 jegy) vagy 8 bájt (~1E308, 15–16 jegy). A //, DIV, %, MOD valósra <b>nem értelmezett</b>.</td></tr><tr><td>Karakter</td><td>összefűzés (+), hasonlítás ASCII-kód szerint. \'A\' = 65, \'a\' = 97: nagy- és kisbetű között mindig 32 a különbség.</td></tr><tr><td>Logikai</td><td>igaz, hamis. NOT, AND, OR, kizáró vagy (&lt;&gt;). hamis &lt; igaz → igaz.</td></tr></table>')+
  C("3. Műveleti prioritás",'<p>Csökkenő sorrend:</p><table><tr><td>1</td><td>egyoperandusú: előjel (+, −), NOT</td></tr><tr><td>2</td><td>hatványozás: **</td></tr><tr><td>3</td><td>multiplikatív: *, /, DIV, //, MOD, %, AND</td></tr><tr><td>4</td><td>additív: +, −, OR</td></tr><tr><td>5</td><td>hasonlítás: =, &lt;&gt;, &lt;, &gt;, &lt;=, &gt;=, IN</td></tr></table><p>Zárójel és függvényhívás operandus szintre emelkedik. Azonos prioritásnál balról jobbra. Logikai kifejezésnél <b>rövid kiértékelés</b>: ha az AND bal oldala hamis, a jobb oldal nem értékelődik ki. Az eredmény egész, ha minden operandus egész és a művelet nem /; különben valós.</p><p class="ex">Függvények: ABS, EXP, LOG (természetes alapú), SIN/COS (radián!), SQR (négyzet), SQRT (gyök), RANDOM(X) (0 … X−1), ASC, CHR, INT (egész rész).</p>')+
  C("4. Utasítások, adatszerkezeti táblázat",'<p><b>Értékadás (←)</b>: megengedett, ha a típus egyezik, vagy valósba egészet, egészbe valóst (a <b>törtrész elvész</b>), sztringbe karaktert teszünk.</p><p><b>Be / Ki</b>: csak egész, valós, karakter, sztring. Logikai változót nem olvasunk be és nem írunk ki.</p><p><b>Adatszerkezeti táblázat</b> oszlopai: Funkció, Azonosító (egyedi), Típus, Jelleg (<span class="tag">I</span> input, <span class="tag">M</span> munka, <span class="tag">O</span> output; több is lehet egyszerre).</p>')+
  C("5. Vezérlőszerkezetek",'<p><b>Szekvencia</b>, <b>szelekció</b> (if / else if / else, a feltételek páronként kizárják egymást), <b>iteráció</b>:</p><table><tr><th>Ciklus</th><th>Feltétel</th><th>Min. futás</th></tr><tr><td>while f</td><td>bennmaradási (amíg f igaz)</td><td>0</td></tr><tr><td>for CV ← KE, VE, LE</td><td>lépésköz alapból 1, 0 tilos, valós is lehet</td><td>0</td></tr><tr><td>do … while f</td><td>bennmaradási</td><td>1</td></tr><tr><td>repeat … until f</td><td><b>kilépési</b> (amíg f igazzá nem válik)</td><td>1</td></tr></table>')+
  C("6. Tömb, sztring, halmaz",'<p><b>Tömb</b>: azonos típusú elemek, indexelés minden dimenzióban <b>1-től</b>. Az index tetszőleges egész kifejezés. A tömbre magára nincs művelet, csak az elemeire. (Ezért pl. <span class="tag">A[0]</span> vagy <span class="tag">A[-1]</span> → hiba, #.)</p><p><b>Sztring</b>: 1-től indexelt (S[I]). LENGTH(S), POS(mit, miben), COPY(S, honnan, hány_db).</p><p><b>Halmaz</b>: karakterhalmaz (bármely karakter) vagy egészhalmaz (csak 0…255). Konstans: <span class="tag">[8, 1, 200]</span>, <span class="tag">[\'A\'..\'Z\']</span>, üres: <span class="tag">[]</span>. Műveletek: metszet <b>*</b>, unió <b>+</b>, különbség <b>−</b>, hasonlítás =, &lt;&gt;, &lt;=, &gt;= (részhalmaz), IN (eleme).</p>')+
  C("7. Szubrutinok, paraméterátadás",'<p>Önálló, formailag elkülönülő programrész, amit meg kell hívni. <b>Deklaráláskor</b> formális paraméterlista (változók), <b>híváskor</b> aktuális paraméterlista (kifejezések). Az elemszámnak egyeznie kell.</p><p><b>Eljárás</b>: utasításként hívjuk, nincs return. <b>Függvény</b>: kifejezésben használjuk, <span class="tag">return érték</span>. Ugyanaz a szubrutin mindkét formában megírható (a rekurzív is).</p><table><tr><th></th><th>Érték szerint</th><th>Cím szerint</th></tr><tr><td>Mi adódik át</td><td>az érték (másolat)</td><td>a cím</td></tr><tr><td>Jelleg</td><td>csak input</td><td>input és output</td></tr><tr><td>Aktuális paraméter</td><td>konstans, változó, kifejezés</td><td><b>csak változó</b></td></tr></table><p>Nagy adat (tömb) input esetén is célszerű cím szerint átadni. A munka (M) adatok lokális változók. A <b>verem</b> tárolja a paramétereket és a lokális változókat (ezért a rekurzió sok memóriát használ).</p>')+
  C("8. Hatékonyság",'<p>A nagyságrend a domináns műveletszám n függvényében: konstans szorzó és alacsonyabb tagok elhagyva (2n² + 3n + 1 → n²).</p><table><tr><th>Módszer</th><th>Nagyságrend</th></tr><tr><td>buborék, kiválasztásos, beszúrásos</td><td>n²</td></tr><tr><td>hatékony rendezések</td><td>n·log₂n</td></tr><tr><td>gyorsrendezés</td><td>átlag n·log₂n, legrosszabb n²</td></tr></table>')+
  C("9. Rendezések (növekvő)",'<p><b>BUBREND</b>: <span class="tag">for I ← 1, N−1</span>, <span class="tag">for J ← N, I+1, −1</span>, ha A[J] &lt; A[J−1] csere. Hátulról előre, a legkisebb „felbuborékol” az I. helyre. <b>&gt;</b> feltétellel csökkenő.</p><p><b>KIVALREND</b>: K ← I, a J ← I+1 … N részben a legkisebb indexét K-ba jegyzi, a kör végén ha K &gt; I, egyetlen csere: A[I] ↔ A[K]. Közben semmi más nem mozdul.</p><p><b>BESZURREND</b>: <span class="tag">for I ← 2, N</span>, X ← A[I], a tőle balra lévő rendezett részben jobbra tolja a nála nagyobbakat (A[J] &gt; X), majd A[J+1] ← X. A[J] &lt; X feltétellel csökkenő.</p>')+
  C("10. Keresések",'<p><b>LINKER</b> (rendezetlen): amíg I ≤ N és A[I] ≠ X, I ← I+1. VAN ← I ≤ N.</p><p><b>LINKERREND</b> (rendezett): amíg I ≤ N és A[I] &lt; X léptet. VAN ← (I ≤ N) AND (A[I] = X).</p><p><b>BINKER</b> (csak rendezetten!): I ← 1, J ← N; amíg I ≤ J és NOT VAN: K ← (I+J) DIV 2; egyenlő → VAN; X &lt; A[K] → J ← K−1; különben I ← K+1. <b>HOL</b>: ha megvan, K; ha nincs, <b>I</b> (ide szúrható be rendezetten).</p><p><b>Indextábla</b>: IT = 1..N, hivatkozás A[IT[…]]. Az A sorrendje nem változik, csak egészeket cserélünk, és több szempont szerint is rendezhető. BINKERIT-nél a HOL az indextáblabeli hely, a valódi elem: <span class="tag">A[IT[HOL]]</span>.</p>')+
  C("11. Rekordok",'<p>Több, akár eltérő típusú adat egy egységben. Mező elérése: <span class="tag">R.MEZO</span>. Rekordra nincs általános művelet, de azonos típusú rekordok közt az értékadás megengedett (CS ← H[I]). Kombinálható: <span class="tag">KONYVEK[2].CIM</span>, <span class="tag">U[I].DB[J]</span>, <span class="tag">JARATOK[I].HONNAN.AZON</span>.</p>')+
  C("12. Rekurzió, gyorsrendezés",'<p>Rekurzív: önmagát hívja (közvetlenül vagy közvetve), csak szubrutinnal. Minden rekurzív algoritmus megírható rekurzió nélkül is, de a rekurzív rövidebb, áttekinthetőbb.</p><p><b>GYORSREND(A, K, V)</b>: ha K &lt; V: I ← K, J ← V, strázsa S ← A[(I+J) DIV 2]. Amíg I ≤ J: <span class="tag">while A[I] &lt; S: I++</span>, <span class="tag">while A[J] &gt; S: J−−</span>, ha I ≤ J csere, I++, J−−. Utána GYORSREND(A, K, J) és GYORSREND(A, I, V).</p>')+
  C("13. Kínai gyűrűk, visszalépéses keresés",'<p><b>Kínai gyűrűk</b>: egyszerre 1 gyűrű; az 1. szabadon mozog; az N. mozgatásához az (N−1). fent, az (N−2)…1. lent. GYURUK tömb (1 fent, 0 lent), kezdetben csupa 1. Eljárások: LE, FEL, BALRALE (+KIIR), kezdőhívás BALRALE(N).</p><p><b>Nyolc királynő</b> (összes megoldás): for minden választásra → ha jó, feljegyez → nem teljes: rekurzív hívás, különben kiír → mindig töröl. HOL, OSZL: MAXMERET elemű; FATL, MATL: 2·MAXMERET−1 elemű logikai. S. sor, O. oszlop: <span class="tag">OSZL[O]</span>, <span class="tag">FATL[S−O+N]</span>, <span class="tag">MATL[S+O−1]</span>. Indítás: minden hamis, PROBAL(1).</p><p><b>Huszár útja</b> (egy megoldás): repeat … until VANMEGO OR nincs több lépés. Nem teljes (LEPES &lt; N·N) → rekurzió, és csak NOT VANMEGO esetén töröl. TABLA, LEPS/LEPO 8 elemű elmozdulástömbök. Indítás: kezdőmező 1, többi 0, PROBAL(2, KEZDOMEZO). 4×4-en nincs teljes bejárás.</p>');
}

var ZX=[["<b>Feltöltés.</b> A „for I ← 1, 5” sor azt jelenti: I legyen 1, aztán 2, 3, 4, 5, és minden értékre fusson le a beljebb húzott sor. Itt az: A[I] ← I − 1, vagyis az I. fiókba I−1 kerül.", "A tömb így néz ki: A[1] = 0, A[2] = 1, A[3] = 2, A[4] = 3, A[5] = 4.", "<b>Hívás.</b> VALAMI(A, 3, ER): a VALAMI megkapja a tömböt, DB = 3-at, és az ER-t, amibe az eredményt írja.", "ER ← 0: a „gyűjtőt” kinullázzuk.", "A ciklus: „for I ← 1, DB, 2” → I 1-től DB-ig (3-ig) megy, de <b>kettesével</b>. Tehát I = 1, utána I = 3, a következő 5 lenne, de az már több mint 3, így ott megáll.", "I = 1: ER = 0 + A[1] = 0 + 0 = 0.", "I = 3: ER = 0 + A[3] = 0 + 2 = 2.", "Kiírjuk az ER-t: <b>2</b>."], ["Feltöltés: I = 1, 2, 3, 4 és A[I] ← I, tehát A[1] = 1, A[2] = 2, A[3] = 3, A[4] = 4. (Az 5. fiók üres maradt, de nem is használjuk.)", "VALAMI(A, 4, ER): összeadja az első 4 fiók tartalmát, egyesével lépve.", "ER = 0 → +1 = 1 → +2 = 3 → +3 = 6 → +4 = 10.", "Kiírjuk: <b>10</b>."], ["Feltöltés <b>visszafelé</b>: „for I ← 5, 1, −1” → I = 5, 4, 3, 2, 1 (a −1 a lépésköz, csökken). Mindig A[I] ← I.", "I = 5: A[5] = 5; I = 4: A[4] = 4; … I = 1: A[1] = 1. A végeredmény ugyanaz, mint előre: (1, 2, 3, 4, 5). A sorrend, ahogy a fiókokat töltjük, nem számít.", "VALAMI(A, 3, ER): DB = 3, kettesével → I = 1, majd I = 3 (az 5 már túl van a 3-on).", "ER = A[1] + A[3] = 1 + 3 = <b>4</b>.", "Gyakori hiba: 8-at (3 + 5) vagy 9-et (1 + 3 + 5) írni. A ciklus a <b>DB-ig</b> (3) megy, nem a tömb végéig."], ["Feltöltés: „for I ← −1, −4, −1” → I = −1, −2, −3, −4.", "Az első lépés: A[−1] ← −1. De a tömb fiókjai 1-től vannak számozva (1, 2, 3, 4, 5). Mínusz első fiók nincs.", "Nem létező fiókba írni hiba, ezért a program már itt elakad, a VALAMI-ig el sem jut.", "Válasz: <b>#</b>."], ["Feltöltés: I = 1-nél A[I − 1] = A[0] ← 1.", "A fiókok számozása 1-től indul, a 0. fiók nem létezik.", "Ez hiba, a program megáll. Válasz: <b>#</b>."], ["A feltöltés rendben van (2, 4, 6, 8, 10).", "Nézd meg a VALAMI táblázatát: az ER jellege <b>M,O</b>, az O = output, vagyis a VALAMI ezen keresztül <b>adja vissza</b> az eredményt.", "A visszaadáshoz „cím szerinti” átadás kell: a szubrutin nem másolatot kap, hanem a fiók helyét, hogy bele tudjon írni. Hasonlat: nem egy fénymásolatot adsz át, hanem a kulcsot a fiókodhoz.", "Híváskor viszont ezt írtuk: VALAMI(A, 5, <b>−ER</b>). A −ER egy számítás eredménye (ER mínusz egyszerese), ennek nincs saját fiókja, nincs „címe”, így nincs hova visszaírni.", "Ezért hiba. Válasz: <b>#</b>."], ["Ez a VALAMI egy <b>helyet</b> (sorszámot) ad vissza, nem betűt: a táblázatban az ER típusa egész.", "Betűk összehasonlítása: minden betűnek van egy kódszáma. Az ábécében később lévő betű a nagyobb: e (101) < i (105) < n (110) < r (114) < t (116).", "Mit csinál? ER ← 1: kezdetben az 1. betű a „legjobb”. Utána minden további betűre: ha ST[I] ≥ ST[ER] (nagyobb <b>vagy egyenlő</b>), akkor ez lesz az új legjobb hely.", "\"teri\": ER = 1 (t). e ≥ t? nem. r ≥ t? nem. i ≥ t? nem. → <b>1</b>.", "\"ng\": ER = 1 (n). g ≥ n? nem. → <b>1</b>.", "\"ette\": ER = 1 (e). 2. betű t ≥ e? igen → ER = 2. 3. betű t ≥ t? igen (egyenlő is elég!) → ER = 3. 4. betű e ≥ t? nem. → <b>3</b>.", "Ki: 1 + 1 + 3. Ezek számok, tehát összeadjuk: <b>5</b>."], ["Ez a VALAMI is egy <b>helyet</b> (sorszámot) ad vissza, nem betűt. Ezért a válasz egy szám, nem „ee”.", "Itt a feltétel ST[I] ≤ ST[ER]: a legkisebb (ábécében legelső) betű helyét keresi, és egyenlőségnél is továbblép (vagyis az utolsó előfordulást adja).", "Kódszámok: e (101) < g (103) < i (105) < n (110) < r (114) < t (116).", "\"tering\": ER = 1 (t). 2. e ≤ t? igen → ER = 2. 3. r ≤ e? nem. 4. i ≤ e? nem. 5. n ≤ e? nem. 6. g ≤ e? nem (a g később jön, mint az e). → <b>2</b>.", "\"ette\": ER = 1 (e). t ≤ e? nem. t ≤ e? nem. 4. e ≤ e? igen (egyenlő) → ER = 4. → <b>4</b>.", "Ki: 2 + 4 = <b>6</b>."], ["Ez a VALAMI a szöveg <b>legkisebb betűjét</b> adja vissza (ami az ábécében legelőrébb van). Kezdetben az első betű, aztán ha talál kisebbet, arra cseréli.", "Zárójeleket, mint matekban, <b>belülről kifelé</b> számolunk: először VALAMI(ER), ahol ER = \"ribizli\".", "r, i, b, i, z, l, i → r-rel indul, az i kisebb → i, a b még kisebb → b. A többi (i, z, l, i) nem kisebb a b-nél. Eredmény: \"b\".", "Szövegeknél a + <b>összefűzést</b> jelent: \"ribizli\" + \"b\" = \"ribizlib\".", "Külső hívás: VALAMI(\"ribizlib\") → ebben is a b a legkisebb → \"b\".", "Ezt tesszük ER-be (ER ← \"b\"), és kiírjuk: <b>b</b>. A „ribizlib” csak egy köztes lépés volt."], ["Az ER ← \"ribiz\" sor itt egy elterelés: a kiírás nem az ER-t írja ki, hanem a VALAMI(\"li\") eredményét.", "A VALAMI a legkisebb betűt keresi: kezdetben ER = \"l\". A 2. betű i, ami az ábécében előbb van (i = 105 < l = 108) → ER = \"i\".", "Válasz: <b>i</b>."], ["Az ER egy változó, egy „doboz”, amiben most a \"ribizli\" szöveg van.", "Az ER(…) írásmód azt jelentené, hogy az ER egy szubrutin, amit meghívunk. De az ER nem szubrutin, csak egy szöveg. Ez olyan, mintha azt írnánk: „ribizli(b)”, aminek nincs értelme.", "Ez úgynevezett szintaktikai (helyesírási) hiba, a program le sem fut. Válasz: <b>#</b>."], ["COPY(szöveg, honnan, hány) egy darabot vág ki a szövegből. COPY(\"+-/*#()[]{}\", 2, 1) = a 2. karaktertől 1 darab = <b>\"-\"</b>. Tehát ez csak egy kötőjel.", "Számozzuk meg a szöveget: A1 L2 G3 O4 R5 I6 T7 M8 U9 S10 _11 v12 …", "VALAMI(TESZT_ST, 5, 10): ER ← ST[5] = \"R\".", "A ciklus POZ1 + 1 = 6-tól 10-ig megy. Minden lépésben: ER ← ER + \"-\" + ST[I], vagyis a végére tesz egy kötőjelet és a következő betűt.", "I = 6: R-I; I = 7: R-I-T; I = 8: R-I-T-M; I = 9: R-I-T-M-U; I = 10: R-I-T-M-U-S.", "Válasz: <b>R-I-T-M-U-S</b>."], ["COPY(…, 2, 1) = \"-\" (lásd az előző feladatot). Számozás: A1 L2 G3 O4 R5 I6 T7 M8 U9 S10.", "ER ← ST[5] = \"R\".", "A ciklus <b>POZ1 + 2 = 7</b>-ről indul, és <b>kettesével</b> lép 10-ig: I = 7, 9 (a 11 már túl van).", "I = 7: R + - + T = R-T.", "I = 9: R-T + - + U = R-T-U.", "Válasz: <b>R-T-U</b>. (Gyakori hiba: 5-től kezdve minden másodikat venni, pl. R-I-M-S.)"], ["Ugyanaz, mint az előző, csak most az új betű az ER <b>elé</b> kerül: ER ← ST[I] + \"-\" + ER.", "ER ← ST[5] = \"R\".", "I = 7: T + - + R = T-R.", "I = 9: U + - + T-R = U-T-R.", "Az elé írogatás miatt a sorrend megfordul. Válasz: <b>U-T-R</b>."], ["A H egy <b>halmaz</b>, egy „lista” a magánhangzókról (kis- és nagybetűvel is). Az IN azt kérdezi: benne van-e a betű ebben a listában?", "ER ← \"\": kezdetben üres szöveg.", "A betűk az 5–15. helyen: R5 I6 T7 M8 U9 S10 _11 v12 i13 z14 s15.", "Végigmegyünk rajtuk, és csak azt fűzzük az ER végére, amelyik magánhangzó: I (6.), U (9.), i (13.).", "Válasz: <b>IUi</b> (a kis i-t is beleértve, mert a halmazban kisbetűk is vannak)."], ["Mit csinál a buborékrendezés? Hátulról előre megy, és mindig két <b>szomszédos</b> számot néz meg: a J. helyen lévőt és az előtte lévőt (J−1). Ha a feltétel igaz, helyet cserélnek. Így egy kör alatt a „legerősebb” szám (itt: a legnagyobb) végigbuborékol a sor elejére.", "Két számláló van: <b>I</b> = hányadik körnél tartunk (I = 1 az első kör), <b>J</b> = hol tartunk a körön belül. J mindig 10-ről indul és csökken.", "A „ciklusmag már lefutott” azt jelenti: a megadott I-nél és J-nél az összehasonlítást (és ha kell, a cserét) <b>már elvégeztük</b>, és utána állunk meg.", "A kezdő tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4).", "Az I = 1. kör vége: (10, 2, 5, 9, 3, 8, 1, 7, 6, 4)", "Az I = 2. kör vége: (10, 9, 2, 5, 8, 3, 7, 1, 6, 4)", "I = 3, J = 10: ADATOK[10] = 4, ADATOK[9] = 6. 4 > 6? Nem → marad. Tömb: (10, 9, 2, 5, 8, 3, 7, 1, 6, 4)", "I = 3, J = 9: ADATOK[9] = 6, ADATOK[8] = 1. 6 > 1? Igen → csere. Tömb: (10, 9, 2, 5, 8, 3, 7, 6, 1, 4)", "Itt megállunk, ez a válasz. Írd be a számokat vesszővel elválasztva."], ["Mit csinál a buborékrendezés? Hátulról előre megy, és mindig két <b>szomszédos</b> számot néz meg: a J. helyen lévőt és az előtte lévőt (J−1). Ha a feltétel igaz, helyet cserélnek. Így egy kör alatt a „legerősebb” szám (itt: a legkisebb) végigbuborékol a sor elejére.", "Két számláló van: <b>I</b> = hányadik körnél tartunk (I = 1 az első kör), <b>J</b> = hol tartunk a körön belül. J mindig 10-ről indul és csökken.", "A „ciklusmag már lefutott” azt jelenti: a megadott I-nél és J-nél az összehasonlítást (és ha kell, a cserét) <b>már elvégeztük</b>, és utána állunk meg.", "A kezdő tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4).", "Az I = 1. kör vége: (1, 2, 5, 10, 3, 8, 4, 7, 9, 6)", "I = 2, J = 10: ADATOK[10] = 6, ADATOK[9] = 9. 6 < 9? Igen → csere. Tömb: (1, 2, 5, 10, 3, 8, 4, 7, 6, 9)", "I = 2, J = 9: ADATOK[9] = 6, ADATOK[8] = 7. 6 < 7? Igen → csere. Tömb: (1, 2, 5, 10, 3, 8, 4, 6, 7, 9)", "Itt megállunk, ez a válasz. Írd be a számokat vesszővel elválasztva."], ["Mit csinál a buborékrendezés? Hátulról előre megy, és mindig két <b>szomszédos</b> számot néz meg: a J. helyen lévőt és az előtte lévőt (J−1). Ha a feltétel igaz, helyet cserélnek. Így egy kör alatt a „legerősebb” szám (itt: a legnagyobb) végigbuborékol a sor elejére.", "Két számláló van: <b>I</b> = hányadik körnél tartunk (I = 1 az első kör), <b>J</b> = hol tartunk a körön belül. J mindig 10-ről indul és csökken.", "A „ciklusmag már lefutott” azt jelenti: a megadott I-nél és J-nél az összehasonlítást (és ha kell, a cserét) <b>már elvégeztük</b>, és utána állunk meg.", "A kezdő tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4).", "Az I = 1. kör vége: (10, 2, 5, 9, 3, 8, 1, 7, 6, 4)", "I = 2, J = 10: ADATOK[10] = 4, ADATOK[9] = 6. 4 > 6? Nem → marad. Tömb: (10, 2, 5, 9, 3, 8, 1, 7, 6, 4)", "I = 2, J = 9: ADATOK[9] = 6, ADATOK[8] = 7. 6 > 7? Nem → marad. Tömb: (10, 2, 5, 9, 3, 8, 1, 7, 6, 4)", "I = 2, J = 8: ADATOK[8] = 7, ADATOK[7] = 1. 7 > 1? Igen → csere. Tömb: (10, 2, 5, 9, 3, 8, 7, 1, 6, 4)", "I = 2, J = 7: ADATOK[7] = 7, ADATOK[6] = 8. 7 > 8? Nem → marad. Tömb: (10, 2, 5, 9, 3, 8, 7, 1, 6, 4)", "Itt megállunk, ez a válasz. Írd be a számokat vesszővel elválasztva."], ["Mit csinál a kiválasztásos rendezés? Minden körben (I) megkeresi a még rendezetlen rész (I-től a végéig) <b>legkisebb</b> elemét, és egyetlen cserével az I. helyre teszi. A többi szám csak akkor mozdul, ha éppen ő a cserepartner.", "A kezdő tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4).", "I = 1: a 1–10. helyek közül a legkisebb a(z) 1 (6. hely). Csere: 2 ↔ 1. Tömb: (1, 5, 10, 3, 8, 2, 7, 9, 6, 4)", "I = 2: a 2–10. helyek közül a legkisebb a(z) 2 (6. hely). Csere: 5 ↔ 2. Tömb: (1, 2, 10, 3, 8, 5, 7, 9, 6, 4)", "I = 3: a 3–10. helyek közül a legkisebb a(z) 3 (4. hely). Csere: 10 ↔ 3. Tömb: (1, 2, 3, 10, 8, 5, 7, 9, 6, 4)", "I = 4: a 4–10. helyek közül a legkisebb a(z) 4 (10. hely). Csere: 10 ↔ 4. Tömb: (1, 2, 3, 4, 8, 5, 7, 9, 6, 10)", "Az I = 4. kör után állunk meg: <b>1, 2, 3, 4, 8, 5, 7, 9, 6, 10</b>."], ["Mit csinál a beszúrásos rendezés? Mint amikor kártyákat rendezel a kezedben: sorban kiveszed a következő lapot (X), és a tőle balra lévő, már rendezett lapok közé a helyére csúsztatod. A nagyobbakat egy hellyel jobbra tolod, hogy legyen neki hely.", "I = 2-től indul (az első lap egyedül már „rendezett”).", "A kezdő tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4).", "I = 2: kivesszük a(z) 5-t, a tőle balra lévő nagyobbakat egy hellyel jobbra toljuk, és a(z) 5 a(z) 2. helyre kerül. Tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4)", "I = 3: kivesszük a(z) 10-t, a tőle balra lévő nagyobbakat egy hellyel jobbra toljuk, és a(z) 10 a(z) 3. helyre kerül. Tömb: (2, 5, 10, 3, 8, 1, 7, 9, 6, 4)", "I = 4: kivesszük a(z) 3-t, a tőle balra lévő nagyobbakat egy hellyel jobbra toljuk, és a(z) 3 a(z) 2. helyre kerül. Tömb: (2, 3, 5, 10, 8, 1, 7, 9, 6, 4)", "I = 5: kivesszük a(z) 8-t, a tőle balra lévő nagyobbakat egy hellyel jobbra toljuk, és a(z) 8 a(z) 4. helyre kerül. Tömb: (2, 3, 5, 8, 10, 1, 7, 9, 6, 4)", "I = 6: kivesszük a(z) 1-t, a tőle balra lévő nagyobbakat egy hellyel jobbra toljuk, és a(z) 1 a(z) 1. helyre kerül. Tömb: (1, 2, 3, 5, 8, 10, 7, 9, 6, 4)", "Az I = 6. kör után az első 6 szám rendezett, a többi még érintetlen: <b>1, 2, 3, 5, 8, 10, 7, 9, 6, 4</b>."]];
var ZINTRO='<div class="card"><h3>Kezdőknek: hogyan olvasd a feladatokat?</h3>'+
'<p>Minden feladat egy kis program, amit a gép <b>sorról sorra, fentről lefelé</b> hajt végre. A dolgod: kitalálni, mit ír ki a végén. Ha a program hibára fut, a válasz <b>#</b>.</p>'+
'<p class="ex"><b>Tipp:</b> fogj egy papírt, és írd fel egy táblázatba a változók értékét minden lépés után. A „Léptető ▶” gomb pont ezt csinálja meg helyetted.</p>'+
'<table><tr><th>Jel</th><th>Jelentés</th></tr>'+
'<tr><td><span class="tag">X ← 5</span></td><td>Az X nevű „dobozba” betesszük az 5-öt. Ami előtte benne volt, eltűnik.</td></tr>'+
'<tr><td><span class="tag">Ki: X</span></td><td>Kiírja az X tartalmát. Ez a válasz.</td></tr>'+
'<tr><td><span class="tag">for I ← 1, 5</span></td><td>Ismétlés: I legyen 1, 2, 3, 4, 5, és mindegyikre fusson le a <b>beljebb húzott</b> rész.</td></tr>'+
'<tr><td><span class="tag">for I ← 1, 5, 2</span></td><td>Kettesével: I = 1, 3, 5. A harmadik szám a lépésköz.</td></tr>'+
'<tr><td><span class="tag">for I ← 5, 1, -1</span></td><td>Visszafelé: 5, 4, 3, 2, 1.</td></tr>'+
'<tr><td><span class="tag">if feltétel</span></td><td>A beljebb húzott sor csak akkor fut le, ha a feltétel igaz.</td></tr>'+
'<tr><td><span class="tag">A[3]</span></td><td>A tömb egy számozott fiókos szekrény, A[3] a 3. fiók. A számozás <b>1-től</b> indul: A[0] vagy A[-1] nincs, ezért hiba (#).</td></tr>'+
'<tr><td><span class="tag">ST[3]</span></td><td>Egy szöveg (sztring) 3. betűje. Pl. "alma"[3] = "m".</td></tr>'+
'<tr><td><span class="tag">+</span></td><td>Számoknál összeadás (2 + 3 = 5), szövegeknél <b>összefűzés</b> ("ab" + "c" = "abc").</td></tr>'+
'<tr><td><span class="tag">LENGTH(ST)</span></td><td>A szöveg hossza (betűk száma).</td></tr>'+
'<tr><td><span class="tag">COPY(S, 2, 1)</span></td><td>Kivág a szövegből: a 2. betűtől kezdve 1 darabot.</td></tr>'+
'<tr><td><span class="tag">X IN H</span></td><td>Benne van-e X a H halmazban (listában)?</td></tr>'+
'<tr><td><span class="tag">VALAMI(…)</span></td><td><b>Szubrutin</b>: egy elnevezett mini-program. A neve leírásával „meghívjuk”, a zárójelben adjuk át neki az adatokat (paramétereket). A <span class="tag">return ER</span> azt jelenti: ezt az eredményt adja vissza.</td></tr>'+
'</table>'+
'<p><b>Betűk összehasonlítása:</b> minden karakternek van egy kódszáma (ASCII). Ami az ábécében később jön, az a nagyobb: a = 97, b = 98, … z = 122. A nagybetűk kisebbek: A = 65 … Z = 90. Tehát minden kisbetű nagyobb minden nagybetűnél.</p>'+
'<p><b>A táblázat „Jelleg” oszlopa:</b> I = input (bemenő adat), M = munka (segédváltozó), O = output (ezen keresztül jön vissza az eredmény).</p>'+
'<p><b>Érték vs. cím szerinti átadás:</b> érték szerint a szubrutin egy <b>fénymásolatot</b> kap: azt firkálhatja, az eredeti nem változik, és ide bármi írható (szám, változó, számítás). Cím szerint a szubrutin a <b>fiók kulcsát</b> kapja: bele tud írni, így eredményt adhat vissza. Ide csak egy változó neve írható, mert egy számításnak (pl. −ER, 2+3) nincs fiókja.</p></div>'+
'<div class="card"><h3>Mini szótár az igaz/hamis kérdésekhez</h3><table>'+
'<tr><td><b>Verem</b></td><td>Mint egy tányérhalom: amit utoljára tettél rá, azt veszed le először.</td></tr>'+
'<tr><td><b>Formális / aktuális paraméter</b></td><td>Formális: a szubrutin leírásában a zárójelben lévő nevek (pl. VALAMI(A, DB, ER)). Aktuális: híváskor ténylegesen beírt értékek (pl. VALAMI(T, 3, X)). Párban, sorrendben illeszkednek, ezért ugyanannyi kell legyen.</td></tr>'+
'<tr><td><b>Rekurzió</b></td><td>Egy szubrutin önmagát hívja meg. Minden hívás helyet foglal a memóriában (a veremben), ezért sok memóriát használ.</td></tr>'+
'<tr><td><b>Eljárás / függvény</b></td><td>Eljárás: csak „csinál valamit”. Függvény: egy értéket ad vissza (return). Bármi megírható mindkét formában.</td></tr>'+
'<tr><td><b>Mutató, NIL</b></td><td>A mutató egy olyan változó, ami egy másik adat helyére (címére) mutat. A NIL a „sehova nem mutat” érték, de ezt külön be kell állítani: egy friss mutatóban kezdetben „szemét” van.</td></tr>'+
'<tr><td><b>Bináris fa</b></td><td>Családfaszerű szerkezet, ahol minden elemnek <b>legfeljebb</b> két gyereke van (lehet 0 vagy 1 is).</td></tr>'+
'<tr><td><b>Keresőfa vs. kupac</b></td><td>Keresőfa: balra a kisebbek, jobbra a nagyobbak. Kupac: a szülő mindig nagyobb (vagy egyenlő), mint a gyerekei. Ez két különböző szabály, a kupac nem keresőfa.</td></tr>'+
'<tr><td><b>Kétirányban láncolt lista</b></td><td>Elemek láncban, mindegyik tudja az előzőt és a következőt is. Így bármelyik elemből el lehet jutni mindenhova.</td></tr>'+
'<tr><td><b>Kollekció, mutatótömb</b></td><td>Az adatok szétszórva vannak a memóriában, és egy tömb tárolja a rájuk mutató címeket. A „rendezett” azt jelenti, hogy a mutatott adatok sorrendje rendezett, nem maguk a címek.</td></tr>'+
'</table></div>';
function zhTasks(){
  var h=ZINTRO+'<div class="card"><h3>Igaz / hamis</h3><p class="ex">A ZH 1. feladatai.</p><div id="ztf"></div></div>'+
  '<div class="card"><h3>Tagmondatok (A–E)</h3><p class="ex"><b>A</b>: mindkettő igaz, ok-okozat van. <b>B</b>: mindkettő igaz, nincs ok-okozat. <b>C</b>: első igaz, második hamis. <b>D</b>: első hamis, második igaz. <b>E</b>: mindkettő hamis.</p><div id="zae"></div></div>';

 sel:{title:"Kiválasztásos rendezés",intro:'<p>Minden körben (I) megkeressük a hátralévő részben a legnagyobb (vagy legkisebb) elem helyét (K), és ha az nem az I. helyen van, kicseréljük az I. elemmel. Az „I értéke n, és a ciklusmag már lefutott” az n. kör cseréje UTÁNI állapotot jelenti.</p>',inputs:[["a","Tömb (vesszővel)","text","6,2,9,4,7,1,8,3,5"],["d","Feltétel","sel",">",[[">","ADATOK[J] > ADATOK[K] (legnagyobb előre)"],["<","ADATOK[J] < ADATOK[K] (legkisebb előre)"]]]],run:P_sel,sort:true,ask:"Add meg a tömböt (vesszővel) a fent megadott I kör végén:"},
 ins:{title:"Beszúró rendezés",intro:'<p>Az I. elemet (X) kivesszük, és a már rendezett eleje felé haladva addig tolunk jobbra elemeket, amíg a feltétel igaz. Ezután X a felszabadult helyre kerül. Figyeld meg: a feltétel iránya dönti el, hogy növekvő vagy csökkenő lesz a rendezett rész. Az „I értéke n, és a ciklusmag már lefutott” az X elhelyezése UTÁNI állapot.</p>',inputs:[["a","Tömb (vesszővel)","text","6,2,9,4,7,1,8,3,5"],["d","Feltétel","sel","<",[["<","ADATOK[J] < X (a kisebbek tolódnak jobbra)"],[">","ADATOK[J] > X (a nagyobbak tolódnak jobbra)"]]]],run:P_ins,sort:true,ask:"Add meg a tömböt (vesszővel) a fent megadott I kör végén:"},
 flt:{title:"Szűrés halmazzal (IN)",intro:'<p>Az <span class="tag">ST[I] IN H</span> azt kérdezi, hogy a karakter eleme-e a H halmaznak. Az eredmény azokból a karakterekből áll, amelyek benne vannak H-ban, az eredeti sorrendben. A kis- és nagybetű különböző karakter. Üres eredménynél a mezőt üresen hagyod.</p>',inputs:[["s","Sztring","text","Programozas_gyakorlat"],["p1","POZ1","number",1],["p2","POZ2","number",8],["h","H halmaz","text","aeiouAEIOU"]],run:P_flt,ask:"Mit ír ki a TESZT?"},
 idx:{title:"Legkisebb elem indexe",intro:'<p>Fontos különbség: az ER itt <b>index</b> (egész szám), nem karakter. Az ER azt jegyzi meg, hol van az eddigi legkisebb elem, és a <span class="tag">ST[I] &lt; ST[ER]</span> feltétel az ER helyén álló karakterrel hasonlít. Ha két karakter egyenlő, a feltétel hamis, így az ER nem változik, vagyis az első előfordulás marad. <b>&lt;=</b> vagy <b>&gt;=</b> esetén egyenlőnél is lép, ezért az <b>utolsó</b> előfordulás indexét kapod. A visszaadott érték a pozíció, nem a betű.</p>',inputs:[["s","Szó","text","madarak"],["s2","Második szó (összeadáshoz, elhagyható)","text",""],["d","Feltétel","sel","<",[["<","ST[I] < ST[ER] (legkisebb, első előfordulás)"],[">","ST[I] > ST[ER] (legnagyobb, első előfordulás)"],["<=","ST[I] <= ST[ER] (legkisebb, utolsó előfordulás)"],[">=","ST[I] >= ST[ER] (legnagyobb, utolsó előfordulás)"]]]],run:P_idx2,ask:"Mit ír ki a TESZT? (az eredmény egy szám)"},
 cp:{title:"Szövegépítés ciklusban",intro:'<p>Az <span class="tag">ER ← ST[I] + valami + ER</span> minta az új karaktert <b>az eddigi ER elé</b> teszi, így megfordítja a sorrendet. (Ha ER mögé fűzöd: <span class="tag">ER + valami + ST[I]</span>, a sorrend megmarad.) A <span class="tag">COPY(s, kezdet, hossz)</span> az s sztring <b>kezdet</b>. karakterétől (1-től számozva!) másol <b>hossz</b> darabot. Ha a pozíciók kilógnak a sztringből, az eredmény hiba (#).</p>',inputs:[["s","Sztring","text","PROGRAM_teszt"],["p1","POZ1","number",3],["p2","POZ2","number",7],["m","Sorrend","sel","pre",[["pre","ER elé: ST[I] + … + ER"],["post","ER mögé: ER + … + ST[I]"]]],["off","Ciklus kezdete: POZ1 + ?","number",1],["step","Ciklus lépése","number",1],["cs","COPY kezdete (a „+-/*#()[]{}” sztringben)","number",2]],run:P_cp2,ask:"Mit ír ki a TESZT? (hiba esetén #)"},
 bub:{title:"Buborékrendezés állapota",intro:'<p>A belső ciklus <b>hátulról előre</b> halad (J ← N-tól I+1-ig), és a szomszédos párokat cseréli, ha a hátsó kisebb. Minden külső kör (I) végére az I. legkisebb elem a helyére kerül, ezért a tömb eleje fokozatosan rendezetté válik. Az „ez a ciklusmag már lefutott” azt jelenti: a J-hez tartozó összehasonlítás és esetleges csere már megtörtént. Ha a feltétel <b>&gt;</b>, akkor a nagyobb elemek kerülnek előre, vagyis csökkenő rendezés lesz. A feltétel irányát mindig az aktuális kódból olvasd le.</p>',inputs:[["a","Tömb (vesszővel)","text","9,4,7,1,8,3,6,2,5"],["d","Feltétel","sel","<",[["<","ADATOK[J] < ADATOK[J-1] (növekvő)"],[">","ADATOK[J] > ADATOK[J-1] (csökkenő)"]]]],run:P_bub,ask:"Add meg a tömböt (vesszővel) a kiválasztott I, J állapotnál:"}
};
var S={};

function stepper(k,pre){
  pre=pre||{};var c=CFG[k],vals={};
  c.inputs.forEach(function(i){vals[i[0]]=(i[0] in pre)?pre[i[0]]:i[3]});
  S={k:k,i:0,vals:vals};
  $("#view").innerHTML='<div class="card"><h3>'+c.title+'</h3>'+c.intro+
   '<div class="row" id="ins">'+c.inputs.map(function(i){return '<label>'+i[1]+(i[2]==="sel"?'<select data-k="'+i[0]+'">'+i[4].map(function(x){return '<option value="'+esc(x[0])+'"'+(String(vals[i[0]])===x[0]?' selected':'')+'>'+esc(x[1])+'</option>'}).join("")+'</select>':'<input data-k="'+i[0]+'" type="'+i[2]+'" value="'+esc(vals[i[0]])+'">')+'</label>'}).join("")+(k==="bub"?'<label>I<input type="number" id="ji" value="'+(pre.I||2)+'" min="1"></label><label>J<input type="number" id="jj" value="'+(pre.J||6)+'" min="2"></label>':(CFG[k].sort?'<label>I<input type="number" id="ji" value="'+(pre.I||3)+'" min="1"></label>':''))+'<button class="btn" id="go">Betöltés</button></div></div>'+
   '<div class="card"><h3>1. Tippelj</h3><div class="row"><label>'+esc(c.ask)+'<input id="guess" type="text" autocomplete="off"></label><button class="btn alt" id="chk">Ellenőrzés</button><span class="fb" id="gfb"></span></div></div>'+
   '<div class="card"><h3>2. Lépkedj végig</h3><pre class="code" id="code"></pre><div class="arr" id="arr"></div><div class="vars" id="vars"></div><div class="note" id="note"></div><div class="row"><button class="btn alt" id="prev">◀ Előző</button><button class="btn" id="next">Következő ▶</button><button class="btn alt" id="all">Vége</button><span id="pos" class="chip"></span></div><p class="res" id="fin"></p></div>';
  $("#go").onclick=load;$("#chk").onclick=check;
  $("#prev").onclick=function(){S.i=Math.max(0,S.i-1);draw()};
  $("#next").onclick=function(){S.i=Math.min(S.P.steps.length-1,S.i+1);draw()};
  $("#all").onclick=function(){S.i=S.P.steps.length-1;draw()};
  load();
}
function load(){
  var c=CFG[S.k],o={};
  document.querySelectorAll("#ins [data-k]").forEach(function(e){o[e.dataset.k]=e.value});
  if(S.k==="bub"||CFG[S.k].sort)o.a=o.a.split(",").map(function(x){return parseInt(x,10)}).filter(function(x){return !isNaN(x)}).slice(0,12);
  S.P=c.run(o);S.i=0;$("#gfb").textContent="";$("#guess").value="";$("#fin").textContent="";draw();
}
function check(){
  var g=$("#guess").value.trim().replace(/\s+/g,""),r=S.P.res.replace(/\s+/g,"");
  if(S.P.sort){var I2=+$("#ji").value,e=S.P.steps.filter(function(x){return x.end===I2}).pop();if(!e){$("#gfb").className="fb bad";$("#gfb").textContent="Ehhez az I-hez nincs állapot.";return}r=e.arr.join(",")}else if(S.k==="bub"){
    var I=+$("#ji").value,J=+$("#jj").value,st=S.P.steps.filter(function(x){return x.I===I&&x.J===J})[0];
    if(!st){$("#gfb").className="fb bad";$("#gfb").textContent="Ehhez az I, J párhoz nincs állapot (J = N … I+1 között lehet).";return}
    r=st.arr.join(",");
  }
  var ok=g===r;$("#gfb").className="fb "+(ok?"ok":"bad");
  $("#gfb").textContent=ok?"Helyes!":"Még nem. Lépkedj végig, és keresd meg, hol tér el.";
}
function draw(){
  var P=S.P;if(!P.steps.length){$("#note").textContent="Adj meg adatot.";return}
  var s=P.steps[S.i];
  $("#code").innerHTML=P.code.map(function(t,i){return '<div'+(i===s.l?' class="on"':'')+'>'+esc(t)+'</div>'}).join("");
  $("#arr").innerHTML=s.arr?s.arr.map(function(x,i){return '<div class="cell'+((s.hl||[]).indexOf(i)>=0?' h':'')+'">'+x+'<small>'+(i+1)+'</small></div>'}).join(""):"";
  $("#vars").innerHTML=Object.keys(s.v).map(function(k){return '<span class="chip"><b>'+esc(k)+'</b> = '+esc(s.v[k])+'</span>'}).join("");
  $("#note").textContent=s.n;
  $("#pos").textContent=(S.i+1)+" / "+P.steps.length;$("#pos").style.setProperty("--p",((S.i+1)/P.steps.length*100)+"%");
  $("#prev").disabled=S.i===0;$("#next").disabled=S.i===P.steps.length-1;
  $("#fin").textContent=S.i===P.steps.length-1?"Végeredmény: "+P.res:"";
}
function show(){if(cur==="th")theory();else if(cur==="osz")summary();else if(cur==="zh")zhTasks();else stepper(cur)}
(function(){var rt=renderTabs,first=true,last=cur;renderTabs=function(){rt();var a=document.querySelector('#tabs [aria-selected=true]');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest',behavior:first?'auto':'smooth'});if(!first&&last!==cur)window.scrollTo({top:0,behavior:'smooth'});last=cur;first=false};
new MutationObserver(function(ms){ms.forEach(function(m){var e=m.target.nodeType===3?m.target.parentNode:m.target;if(e&&(e.id==='gfb'||e.id==='note'||e.id==='fin')){e.style.animation='none';void e.offsetWidth;e.style.animation=''}})}).observe(document.body,{subtree:true,childList:true,characterData:true});
document.addEventListener('keydown',function(e){var t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;var b=e.key==='ArrowRight'?$('#next'):e.key==='ArrowLeft'?$('#prev'):null;if(b&&!b.disabled){e.preventDefault();b.click()}})})();
(function(){var b=document.createElement('button'),m=document.querySelector('main'),dark=matchMedia('(prefers-color-scheme:dark)').matches;b.className='tt';b.setAttribute('aria-label','Téma váltása');m.insertBefore(b,m.firstChild);function set(d){dark=d;document.documentElement.dataset.theme=d?'dark':'light';b.textContent=d?'☀️':'🌙'}set(dark);b.onclick=function(){set(!dark)}})();
renderTabs();show();
</script>
</body>
</html>
